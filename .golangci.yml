version: 2

run:
  go: "1.24"
  timeout: 5m
  issues-exit-code: 1
  tests: true
  skip-dirs:
    - vendor
  skip-files:
    - ".*_test.go"

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  gocyclo:
    min-complexity: 15

  govet:
    check-shadowing: true

  misspell:
    locale: US

  unused:
    check-exported: false

  gosec:
    excludes:
      - G204  # subprocess launched with variable
      - G304  # file path provided as taint input

linters:
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - copyloopvar
    - exhaustive
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - mnd
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace

formatters:
  enable:
    - gofmt
    - goimports

  disable:
    - gochecknoglobals  # グローバル変数の使用は制限しない
    - godox            # TODOコメントは許可
    - gofumpt          # gofmtで十分
    - nlreturn         # 改行ルールは緩める

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gomnd
        - goconst
        - dupl

  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
