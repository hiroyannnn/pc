name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25

    - name: Run tests
      run: go test -v ./...

    - name: Build for multiple platforms
      run: |
        mkdir -p dist

        # Linux
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/pc-linux-amd64 package-checker.go
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/pc-linux-arm64 package-checker.go

        # macOS
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/pc-darwin-amd64 package-checker.go
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/pc-darwin-arm64 package-checker.go

        # Windows
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/pc-windows-amd64.exe package-checker.go
        GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o dist/pc-windows-arm64.exe package-checker.go

    - name: Create compressed archives
      run: |
        cd dist

        # Linux
        tar -czf pc-linux-amd64.tar.gz pc-linux-amd64
        tar -czf pc-linux-arm64.tar.gz pc-linux-arm64

        # macOS
        tar -czf pc-darwin-amd64.tar.gz pc-darwin-amd64
        tar -czf pc-darwin-arm64.tar.gz pc-darwin-arm64

        # Windows
        zip pc-windows-amd64.zip pc-windows-amd64.exe
        zip pc-windows-arm64.zip pc-windows-arm64.exe

    - name: Generate checksums
      run: |
        cd dist
        sha256sum *.tar.gz *.zip > checksums.txt

    - name: Get version from tag
      id: version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Generate release notes
      id: release_notes
      run: |
        echo "release_notes<<EOF" >> $GITHUB_OUTPUT
        echo "## Changes" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        git log --oneline --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "## Downloads" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "### Linux" >> $GITHUB_OUTPUT
        echo "- [pc-linux-amd64.tar.gz](https://github.com/hiroyannnn/pc/releases/download/${{ steps.version.outputs.version }}/pc-linux-amd64.tar.gz)" >> $GITHUB_OUTPUT
        echo "- [pc-linux-arm64.tar.gz](https://github.com/hiroyannnn/pc/releases/download/${{ steps.version.outputs.version }}/pc-linux-arm64.tar.gz)" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "### macOS" >> $GITHUB_OUTPUT
        echo "- [pc-darwin-amd64.tar.gz](https://github.com/hiroyannnn/pc/releases/download/${{ steps.version.outputs.version }}/pc-darwin-amd64.tar.gz)" >> $GITHUB_OUTPUT
        echo "- [pc-darwin-arm64.tar.gz](https://github.com/hiroyannnn/pc/releases/download/${{ steps.version.outputs.version }}/pc-darwin-arm64.tar.gz)" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "### Windows" >> $GITHUB_OUTPUT
        echo "- [pc-windows-amd64.zip](https://github.com/hiroyannnn/pc/releases/download/${{ steps.version.outputs.version }}/pc-windows-amd64.zip)" >> $GITHUB_OUTPUT
        echo "- [pc-windows-arm64.zip](https://github.com/hiroyannnn/pc/releases/download/${{ steps.version.outputs.version }}/pc-windows-arm64.zip)" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "### 検証" >> $GITHUB_OUTPUT
        echo "ダウンロードしたファイルの整合性を確認するには、[checksums.txt](https://github.com/hiroyannnn/pc/releases/download/${{ steps.version.outputs.version }}/checksums.txt)を使用してください。" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.tar.gz
          dist/*.zip
          dist/checksums.txt
        body: ${{ steps.release_notes.outputs.release_notes }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}